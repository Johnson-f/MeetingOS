[package]
name = "meeting-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = "0.8.8"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clerk-rs = { version = "0.4.2", features = ["axum"] }
dotenvy = "0.15.7"
futures-util = "0.3"
hmac = "0.12.1"
libsql = "0.9.29"
qdrant-client = "1.17"
redis = { version = "1.0.5", features = ["tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.7"
urlencoding = "2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }